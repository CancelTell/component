# Prices every 4 hours: store feeds → data/offers.json + data/price-history.json.
# Without feed secrets the step exits quietly and the site keeps demo prices.
name: Обновление цен

on:
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Обновить цены
        run: npm run data:prices
        env:
          FEED_DNS: ${{ secrets.FEED_DNS }}
          FEED_OZON: ${{ secrets.FEED_OZON }}
          FEED_CITILINK: ${{ secrets.FEED_CITILINK }}
          FEED_MVIDEO: ${{ secrets.FEED_MVIDEO }}
      - name: Сохранить изменения
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "data: цены $(date -u +%F' '%H:%M)"
          git pull --rebase --autostash
          git push
