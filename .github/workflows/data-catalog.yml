# Daily catalog update: CPUs/GPUs from Wikipedia, other parts from Open Icecat, models on sale from store feeds.
# Commits data/catalog.json and data/report.md; Vercel redeploys the site on that push.
name: Обновление каталога

on:
  schedule:
    - cron: '17 1 * * *' # every day at 04:17 Moscow time
  workflow_dispatch: # «Run workflow» button in the Actions tab

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Кэш ответов Icecat
        uses: actions/cache@v4
        with:
          path: .cache/icecat.json
          key: icecat-${{ github.run_id }}
          restore-keys: icecat-
      - name: Собрать каталог
        run: npm run data:catalog
        env:
          ICECAT_USERNAME: ${{ secrets.ICECAT_USERNAME }}
          ICECAT_PASSWORD: ${{ secrets.ICECAT_PASSWORD }}
          ICECAT_API_TOKEN: ${{ secrets.ICECAT_API_TOKEN }}
          FEED_DNS: ${{ secrets.FEED_DNS }}
          FEED_OZON: ${{ secrets.FEED_OZON }}
          FEED_CITILINK: ${{ secrets.FEED_CITILINK }}
          FEED_MVIDEO: ${{ secrets.FEED_MVIDEO }}
      - name: Сохранить изменения
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "data: каталог $(date -u +%F)"
          git pull --rebase --autostash
          git push
